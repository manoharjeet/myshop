<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ayangba Store</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 960px; margin: 20px auto; padding: 0 15px; background: #f8fafc; color: #1e293b; }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #e2e8f0; padding-bottom: 12px; }
        h1 { margin: 0; font-size: 24px; color: #0f172a; }
        h2 { color: #0f172a; font-size: 18px; margin-top: 0; }
        .admin-section { display: none; background: #fff; padding: 18px; border-radius: 10px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); margin-bottom: 25px; border-left: 4px solid #2563eb; }
        form { display: flex; gap: 10px; flex-wrap: wrap; }
        input, select { padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; flex: 1; min-width: 150px; }
        button { padding: 10px 16px; background: #2563eb; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 14px; }
        button:hover { background: #1d4ed8; }
        button:disabled { background: #94a3b8; }
        .btn-outline { background: transparent; color: #2563eb; border: 1px solid #2563eb; }
        .btn-danger { background: #ef4444; }
        .btn-wa { background: #16a34a; color: #fff; text-align: center; text-decoration: none; padding: 9px 12px; border-radius: 6px; font-weight: 600; font-size: 13px; margin-top: 8px; display: block; }
        .btn-wa:hover { background: #15803d; }
        .toolbar { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(215px, 1fr)); gap: 18px; }
        .card { background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 6px rgba(0,0,0,0.06); display: flex; flex-direction: column; }
        .card img { width: 100%; height: 170px; object-fit: cover; background: #e2e8f0; }
        .info { padding: 14px; display: flex; flex-direction: column; gap: 6px; flex: 1; }
        .title { font-weight: 700; font-size: 16px; }
        .price { color: #16a34a; font-weight: 700; font-size: 16px; }
        .card-actions { display: none; gap: 8px; margin-top: 8px; }
        .card-actions button { padding: 6px 10px; font-size: 12px; flex: 1; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.5); align-items: center; justify-content: center; padding: 15px; z-index: 50; }
        .modal-content { background: #fff; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
        .modal-content form { flex-direction: column; }
        .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 10px; }
    </style>
</head>
<body>
    <header>
        <h1>Ayangba Store</h1>
        <button id="authBtn" class="btn-outline" style="display:none;" onclick="toggleAdmin()">Admin Login</button>
    </header>
    <div class="admin-section" id="adminPanel">
        <h2>Anouba Product Hapchinba (Add Product)</h2>
        <form id="uploadForm">
            <input type="text" id="name" placeholder="Product Ming" required />
            <input type="number" step="0.01" id="price" placeholder="Mamal (₹)" required />
            <input type="file" id="file" accept="image/*" required />
            <button type="submit" id="btn">Add Product</button>
        </form>
    </div>
    <div class="toolbar">
        <input type="text" id="searchInput" placeholder="Product thiba (Search by name)..." oninput="renderProducts()" />
        <select id="sortSelect" onchange="renderProducts()" style="max-width: 200px;">
            <option value="newest">Anouba (Newest)</option>
            <option value="price_asc">Mamal: Nemba -> Wangba</option>
            <option value="price_desc">Mamal: Wangba -> Nemba</option>
        </select>
    </div>
    <div class="grid" id="grid"></div>
    <div class="modal" id="editModal">
        <div class="modal-content">
            <h2>Product Semdokpa (Edit)</h2>
            <form id="editForm">
                <input type="hidden" id="editId" />
                <label style="font-size:12px; font-weight:600;">Product Ming</label>
                <input type="text" id="editName" required />
                <label style="font-size:12px; font-weight:600;">Mamal (₹)</label>
                <input type="number" step="0.01" id="editPrice" required />
                <label style="font-size:12px; font-weight:600;">Anouba Photo (Optional)</label>
                <input type="file" id="editFile" accept="image/*" />
                <div class="modal-actions">
                    <button type="button" class="btn-outline" onclick="closeModal()">Cancel</button>
                    <button type="submit" id="editBtn">Save Changes</button>
                </div>
            </form>
        </div>
    </div>




    <script>
        const WHATSAPP_NUMBER = "8413960348"; // Nanggi 91 + 10-digit WhatsApp number hapchinbiyu
        let allProducts = [];
        let adminPassword = sessionStorage.getItem('adminPassword') || '';

        function updateAdminUI() {
            const isAdmin = Boolean(adminPassword);
            document.getElementById('adminPanel').style.display = isAdmin ? 'block' : 'none';
            document.getElementById('authBtn').textContent = isAdmin ? 'Logout Admin' : 'Admin Login';
            document.querySelectorAll('.card-actions').forEach(el => { el.style.display = isAdmin ? 'flex' : 'none'; });
        }
        async function toggleAdmin() {
            if (adminPassword) {
                adminPassword = '';
                sessionStorage.removeItem('adminPassword');
                updateAdminUI();
                if (new URLSearchParams(window.location.search).get('admin') !== '1') {
                    document.getElementById('authBtn').style.display = 'none';
                }
                return;
            }
            const pass = prompt('Admin Password hapchinbiyu:');
            if (!pass) return;
            const res = await fetch('/verify-admin', { method: 'POST', headers: { 'X-Admin-Password': pass } });
            if (res.ok) { adminPassword = pass; sessionStorage.setItem('adminPassword', pass); updateAdminUI(); }
            else { alert('Password lalli! (Wrong password)'); }
        }
        async function loadProducts() {
            const res = await fetch('/products/');
            allProducts = await res.json();
            renderProducts();
        }
        function renderProducts() {
            const grid = document.getElementById('grid');
            const query = document.getElementById('searchInput').value.toLowerCase();
            const sortBy = document.getElementById('sortSelect').value;
            let filtered = allProducts.filter(p => p.name.toLowerCase().includes(query));
            if (sortBy === 'price_asc') filtered.sort((a, b) => a.price - b.price);
            if (sortBy === 'price_desc') filtered.sort((a, b) => b.price - a.price);
            grid.innerHTML = filtered.length ? '' : '<p>Product amatta fangde.</p>';
            filtered.forEach(p => {
                const msg = encodeURIComponent(`Khurumjari! Ei "${p.name}" (Mamal: ₹${p.price}) asi order touba pammi.`);
                const waLink = `https://wa.me{WHATSAPP_NUMBER}?text=${msg}`;
                const card = document.createElement('div');
                card.className = 'card';
                card.innerHTML = `
                    <img src="${p.image_url}" alt="${p.name}" loading="lazy" />
                    <div class="info">
                        <div class="title">${p.name}</div>
                        <div class="price">₹ ${p.price}</div>
                        <a href="${waLink}" target="_blank" class="btn-wa">WhatsApp-ta Order Touba</a>
                        <div class="card-actions">
                            <button onclick="openEditModal(${p.id}, '${p.name.replace(/'/g, "\\'")}', ${p.price})">Edit</button>
                            <button class="btn-danger" onclick="deleteProduct(${p.id})">Delete</button>
                        </div>
                    </div>`;
                grid.appendChild(card);
            });
            updateAdminUI();
        }
        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('file');
            const btn = document.getElementById('btn');
            if (!fileInput.files || !fileInput.files.item(0)) return alert('Image ama khallu!');
            btn.disabled = true; btn.textContent = 'Uploading...';
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('price', document.getElementById('price').value);
            formData.append('file', fileInput.files.item(0));
            const res = await fetch('/products/', { method: 'POST', headers: { 'X-Admin-Password': adminPassword }, body: formData });
            if (res.ok) { e.target.reset(); loadProducts(); } else { alert('Upload failed.'); }
            btn.disabled = false; btn.textContent = 'Add Product';
        });
        function openEditModal(id, name, price) {
            document.getElementById('editId').value = id;
            document.getElementById('editName').value = name;
            document.getElementById('editPrice').value = price;
            document.getElementById('editFile').value = '';
            document.getElementById('editModal').style.display = 'flex';
        }
        function closeModal() { document.getElementById('editModal').style.display = 'none'; }
        document.getElementById('editForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const id = document.getElementById('editId').value;
            const editBtn = document.getElementById('editBtn');
            const fileInput = document.getElementById('editFile');
            editBtn.disabled = true; editBtn.textContent = 'Saving...';
            const formData = new FormData();
            formData.append('name', document.getElementById('editName').value);
            formData.append('price', document.getElementById('editPrice').value);
            if (fileInput.files && fileInput.files.item(0)) { formData.append('file', fileInput.files.item(0)); }
            const res = await fetch('/products/' + id, { method: 'PUT', headers: { 'X-Admin-Password': adminPassword }, body: formData });
            if (res.ok) { closeModal(); loadProducts(); } else { alert('Update failed.'); }
            editBtn.disabled = false; editBtn.textContent = 'Save Changes';
        });
        async function deleteProduct(id) {
            if (!confirm('Product asi delete touba pambra?')) return;
            const res = await fetch('/products/' + id, { method: 'DELETE', headers: { 'X-Admin-Password': adminPassword } });
            if (res.ok) loadProducts();
        }
        if (new URLSearchParams(window.location.search).get('admin') === '1' || adminPassword) {
            document.getElementById('authBtn').style.display = 'inline-block';
        }
        loadProducts();
    </script>
</body>
</html>
